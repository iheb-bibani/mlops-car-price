services:

  mlflow:
    image: python:3.11-slim
    working_dir: /app

    volumes:
      - ./mlflow-data:/app/mlflow-data

    command: >
      sh -c "
      pip install mlflow &&
      mlflow server
      --backend-store-uri sqlite:////app/mlflow-data/mlflow.db
      --artifacts-destination /app/mlflow-data/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts 'mlflow:5000,localhost:*'
      "

    ports:
      - "5000:5000"

  api:
    build: .
    ports:
      - "8000:8000"

    depends_on:
      - mlflow